---
pia:
  webclient:
    openid:
      sh-client:
        connection-provider-name: sh-client
        fixed-headers:
          application: tmf641-soa
        token-config:
          use-mock: true
          cache-name: sh-client-cache
          cache-expiry-seconds: 10
          token-url: https://localhost:1080/sh/auth2/token
          basic-auth-username: myClientId
          basic-auth-password: mySecret
          form-data:
            username: myUsername
            password: myPassword
            grant-type: password
            scope: openid
      apix-client:
        connection-provider-name: apix-client
        fixed-headers:
          application: tmf641-soa
        token-config:
          use-mock: true
          cache-name: apix-client-cache
          cache-expiry-seconds: 10
          token-url: https://localhost:1080/sh/auth2/token
          basic-auth-username: myClientId
          basic-auth-password: mySecret
          form-data:
            username: myUsername
            password: myPassword
            grant-type: password
            scope: openid
      dxl-client:
        connection-provider-name: apix-client
        fixed-headers:
          application: tmf641-soa
        token-config:
          use-mock: true
          cache-name: dxl-client-cache
          cache-expiry-seconds: 10
          token-url: https://localhost:1080/sh/auth2/token
          basic-auth-username: myClientId
          basic-auth-password: mySecret
          form-data:
            username: myUsername
            password: myPassword
            grant-type: password
            scope: openid
    basic:
      basic-client:
        connection-provider-name: basic-client
        token-config:
          username: user
          password: pass

  tmf-clients:
    sh-tmf641:
      base-url: http://sh-client
      endpoint: /serviceOrder
      scopes:
        get: SH_GET_TMF_MODEL
        list: SH_GET_LIST_TMF_MODEL
        post: SH_POST_TMF_MODEL
        patch: SH_PATCH_TMF_MODEL
        delete: SH_DELETE_TMF_MODEL
    apix-tmf641:
      base-url: http://apix-client
      endpoint: /serviceOrder
      scopes:
        get: APIX_GET_PRODUCT_ORDER_BY_ID
        list: APIX_GET_LIST_PRODUCT_ORDER
        post: APIX_POST_PRODUCT_ORDER
        patch: APIX_PATCH_PRODUCT_ORDER
        delete: APIX_DELETE_PRODUCT_ORDER
